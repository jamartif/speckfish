<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="716" viewBox="0 0 1240 716" role="img" aria-labelledby="t d">
  <title id="t">speckfish flow</title>
  <desc id="d">speckfish orchestrates Spec Kit (init, constitution, specify, plan, tasks) and EGM (brainstorm, draft, review, drift) as one agent subprocess per step, with per-run logs, artifacts and state and a short readable summary.</desc>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .t  { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .m  { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .h1 { font-size: 25px; font-weight: 700; fill: #0f172a; }
      .lbl{ font-size: 13.5px; font-weight: 700; fill: #0f172a; }
      .sm { font-size: 11.5px; fill: #475569; }
      .xs { font-size: 10.5px; fill: #64748b; }
      .lane { font-size: 11px; font-weight: 700; fill: #64748b; letter-spacing: .12em; }
      .box       { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.4; }
      .box-blue  { fill: #eff6ff; stroke: #1b6ef3; stroke-width: 1.4; }
      .box-green { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.4; }
      .box-amber { fill: #fffbeb; stroke: #d97706; stroke-width: 1.4; }
      .box-gray  { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .panel     { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.2; }
      .edge      { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
      .dash      { stroke: #cbd5e1; stroke-width: 1.3; fill: none; stroke-dasharray: 5 4; }
    </style>
  </defs>

  <rect x="0" y="0" width="1240" height="716" fill="#ffffff"/>
  <rect x="0.75" y="0.75" width="1238.5" height="714.5" fill="none" stroke="#e2e8f0" rx="18"/>

  <text class="t h1" x="40" y="52">🐟 speckfish — one orchestrator over Spec Kit + EGM</text>
  <text class="t sm" x="40" y="74">One agent subprocess per step · artifacts, logs and state per run · a short summary instead of a transcript.</text>

  <text class="t lane" x="40" y="112">A · DESCUBRIR — OPCIONAL, SOLO SI EL INPUT ES UNA IDEA</text>
  <rect class="box-amber" x="40" y="124" width="186" height="66" rx="10"/>
  <text class="m lbl" x="54" y="148">speckfish brainstorm</text>
  <text class="t sm" x="54" y="166">concepts_brief.md</text>
  <text class="t xs" x="54" y="181">alternativas · riesgos · hipótesis</text>

  <rect class="box-amber" x="256" y="124" width="186" height="66" rx="10"/>
  <text class="m lbl" x="270" y="148">speckfish draft</text>
  <text class="t sm" x="270" y="166">design_draft.md</text>
  <text class="t xs" x="270" y="181">conversacional: marca hipótesis</text>

  <rect class="box-gray" x="472" y="124" width="196" height="66" rx="10"/>
  <text class="t lbl" x="486" y="148">¿ya hay un brief?</text>
  <text class="t sm" x="486" y="166">@brief.md pasa al carril B</text>
  <text class="t xs" x="486" y="181">con requisitos cerrados, salta A</text>

  <path class="edge" d="M226 157 H256" marker-end="url(#arw)"/>
  <path class="edge" d="M442 157 H472" marker-end="url(#arw)"/>
  <path class="dash" d="M570 190 V206 H126 V226" marker-end="url(#arw)"/>

  <text class="t lane" x="40" y="250">B · ESPECIFICAR — SPEC KIT</text>

  <rect class="box" x="40" y="262" width="150" height="70" rx="10"/>
  <text class="m lbl" x="54" y="286">init</text>
  <text class="t sm" x="54" y="304">git · .specify/</text>
  <text class="t xs" x="54" y="319">skills · EGM en vendor/</text>

  <rect class="box" x="214" y="262" width="170" height="70" rx="10"/>
  <text class="m lbl" x="228" y="286">constitution</text>
  <text class="t sm" x="228" y="304">.specify/memory/</text>
  <text class="t xs" x="228" y="319">@template.md</text>

  <rect class="box-blue" x="408" y="262" width="190" height="70" rx="10"/>
  <text class="m lbl" x="422" y="286">specify</text>
  <text class="t sm" x="422" y="304">specs/NNN-slug/spec.md</text>
  <text class="t xs" x="422" y="319">--split · --only · --from-feature</text>

  <rect class="box-blue" x="622" y="262" width="170" height="70" rx="10"/>
  <text class="m lbl" x="636" y="286">plan</text>
  <text class="t sm" x="636" y="304">plan.md · research.md</text>
  <text class="t xs" x="636" y="319">--feature · --all-features</text>

  <rect class="box-blue" x="816" y="262" width="170" height="70" rx="10"/>
  <text class="m lbl" x="830" y="286">tasks</text>
  <text class="t sm" x="830" y="304">tasks.md</text>
  <text class="t xs" x="830" y="319">analyze · checklist · clarify</text>

  <path class="edge" d="M190 297 H214" marker-end="url(#arw)"/>
  <path class="edge" d="M384 297 H408" marker-end="url(#arw)"/>
  <path class="edge" d="M598 297 H622" marker-end="url(#arw)"/>
  <path class="edge" d="M792 297 H816" marker-end="url(#arw)"/>

  <text class="t lane" x="40" y="392">C · VERIFICAR — EGM, SUBAGENTES GOLDFISH CON CONTEXTO LIMPIO</text>

  <rect class="box-green" x="408" y="404" width="190" height="70" rx="10"/>
  <text class="m lbl" x="422" y="428">review</text>
  <text class="t sm" x="422" y="446">consolidated_review_report.md</text>
  <text class="t xs" x="422" y="461">blockers · majors · nits · veredicto</text>

  <rect class="box-green" x="622" y="404" width="170" height="70" rx="10"/>
  <text class="m lbl" x="636" y="428">drift</text>
  <text class="t sm" x="636" y="446">DRIFT_REPORT.md</text>
  <text class="t xs" x="636" y="461">diseño vs código real</text>

  <rect class="box-gray" x="816" y="404" width="170" height="70" rx="10"/>
  <text class="m lbl" x="830" y="428">report</text>
  <text class="t sm" x="830" y="446">imprime el informe</text>
  <text class="t xs" x="830" y="461">--full · --lines N</text>

  <path class="edge" d="M705 332 V404" marker-end="url(#arw)"/>
  <path class="edge" d="M598 439 H622" marker-end="url(#arw)"/>
  <path class="edge" d="M792 439 H816" marker-end="url(#arw)"/>

  <text class="t lane" x="40" y="532">D · ENTREGAR — UNA FEATURE CADA VEZ, CON --yes</text>
  <rect class="box" x="408" y="544" width="190" height="62" rx="10"/>
  <text class="m lbl" x="422" y="568">implement</text>
  <text class="t sm" x="422" y="586">código y tests reales</text>
  <text class="t xs" x="422" y="600">sin --all-features, a propósito</text>

  <path class="edge" d="M503 474 V544" marker-end="url(#arw)"/>

  <text class="t xs" x="40" y="642">El carril A es exploratorio: sus artefactos son hipótesis, no requisitos. B puede arrancar con un brief de 200 líneas, un @archivo.md o una idea en una línea.</text>
  <text class="t xs" x="40" y="662">Verificar después del plan es lo que hace útil la review: ahí ya hay decisiones técnicas que criticar.</text>

  <rect class="panel" x="1010" y="102" width="196" height="200" rx="12"/>
  <text class="t lane" x="1026" y="126">HARNESSES</text>
  <text class="t sm" x="1026" y="148">claude · verificado</text>
  <text class="t sm" x="1026" y="166">copilot · verificado</text>
  <text class="t sm" x="1026" y="184">codex · verificado*</text>
  <text class="t xs" x="1026" y="204">*proveedor OpenAI-</text>
  <text class="t xs" x="1026" y="218">compatible (/v1/responses)</text>
  <text class="t xs" x="1026" y="242">--harness · --model</text>
  <text class="t xs" x="1026" y="258">--no-progress · --json</text>
  <text class="t xs" x="1026" y="274">--quiet · --dry-run</text>
  <text class="t xs" x="1026" y="290">--root</text>

  <rect class="panel" x="1010" y="322" width="196" height="150" rx="12"/>
  <text class="t lane" x="1026" y="346">EXIT CODES</text>
  <text class="t sm" x="1026" y="368">0  ok</text>
  <text class="t sm" x="1026" y="388">1  blockers</text>
  <text class="t sm" x="1026" y="408">2  error</text>
  <text class="t sm" x="1026" y="428">3  entorno (cuota, auth)</text>
  <text class="t xs" x="1026" y="452">cuota ≠ spec mala</text>

  <rect class="panel" x="1010" y="492" width="196" height="172" rx="12"/>
  <text class="t lane" x="1026" y="516">RUN ARTIFACTS</text>
  <text class="m xs" x="1026" y="538">.speckfish/runs/&lt;id&gt;/</text>
  <text class="t xs" x="1038" y="556">state.json</text>
  <text class="t xs" x="1038" y="574">split.json</text>
  <text class="t xs" x="1038" y="592">logs/&lt;step&gt;.log</text>
  <text class="t xs" x="1038" y="610">artifacts/&lt;step&gt;/*.md</text>
  <text class="t xs" x="1026" y="634">+ specs/features.json</text>
  <text class="t xs" x="1026" y="652">(el corte aprobado)</text>
</svg>
