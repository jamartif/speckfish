name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        # macOS lives in its own workflow (tests-macos.yml): its runners queue for a long time or get
        # cancelled outright on shared/limited quotas, which would turn every push red for reasons
        # unrelated to the code.
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15   # a stuck macOS runner should not hold the workflow for hours
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests
      - name: Types
        run: python -m mypy
      - name: Run tests with coverage
        run: python -m pytest -q --cov=speckfish --cov-report=term-missing --cov-fail-under=80
