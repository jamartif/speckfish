name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        # macos-14 instead of macos-latest: the "latest" label queues far longer on shared runners
        os: [ubuntu-latest, macos-14, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15   # a stuck macOS runner should not hold the workflow for hours
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e . pytest
      - name: Run tests
        run: python -m pytest -q
