name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        # macOS lives in its own workflow (tests-macos.yml): its runners queue for a long time or get
        # cancelled outright on shared/limited quotas, which would turn every push red for reasons
        # unrelated to the code.
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15   # a stuck macOS runner should not hold the workflow for hours
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e . pytest
      - name: Run tests
        run: python -m pytest -q
