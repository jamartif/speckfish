name: tests (macOS)

# macOS runners are scarce on shared quotas: they queue for many minutes or get cancelled on arrival,
# which is why this matrix does not run on every push. It runs weekly, on demand, and on tags so a
# release still gets macOS coverage before publishing.
on:
  schedule:
    - cron: "0 6 * * 1"      # Mondays 06:00 UTC
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  pytest-macos:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e . pytest
      - name: Run tests
        run: python -m pytest -q
