[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speckfish"
version = "0.1.0"
description = "Orquestador headless de Spec Kit + Elephant-Goldfish Model (EGM) sobre CLIs de agente"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
speckfish = "speckfish.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
