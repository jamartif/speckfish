[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speckfish"
version = "0.1.2"
description = "Headless orchestrator for Spec Kit + Elephant-Goldfish Model (EGM) over agent CLIs"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
speckfish = "speckfish.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
